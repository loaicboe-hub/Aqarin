# ====================================================================
# AQAR IN (عقار إن) — Global Anti-DDoS, Rate Limiting & Hardening
# File: /etc/nginx/conf.d/security_limits.conf
# ====================================================================

# 1. Rate Limiting Zones (Memory 10m stores ~160,000 client IPs)
# General website browsing: 40 requests/sec per IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=40r/s;

# API endpoints: 20 requests/sec per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Strict Auth (login/register): 10 requests/min per IP to prevent brute-force attacks
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# 2. Connection Limiting Zone (Tracks active TCP connections per IP)
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

# 3. HTTP Status Code for Rate Limiting (Return 429 Too Many Requests)
limit_req_status 429;
limit_conn_status 429;

# 4. Anti-Slowloris & Buffer Overflow Defense
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 20s;
send_timeout 10s;

client_body_buffer_size 128k;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;

# 5. Buffer limits applied
# (server_tokens off is configured in main nginx.conf)

