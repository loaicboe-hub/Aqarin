server {
    server_name aqaarin.com www.aqaarin.com _;
    client_max_body_size 50M;

    root /var/www/aqarin/client/dist;
    index index.html;

    # 1. Connection & General Rate Limiting
    limit_conn addr_conn 30;
    limit_req zone=general_limit burst=50 nodelay;

    # 2. Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 3. Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # 4. Strict Rate Limiting on Authentication (Prevents Brute-Force & Credential Stuffing)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        error_page 429 = @rate_limited_api;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. API Reverse Proxy with Dedicated API Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        error_page 429 = @rate_limited_api;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Clean JSON 429 Response for API clients
    location @rate_limited_api {
        default_type application/json;
        return 429 '{"success":false,"error":"Too Many Requests","message":"تم تجاوز الحد الأقصى للطلبات المسموح بها، يرجى المحاولة بعد قليل.","messageEn":"Rate limit exceeded. Please try again shortly.","status":429}';
    }

    # 6. Uploads Static Assets
    location ^~ /uploads/ {
        alias /var/www/aqarin/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 7. Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 8. React SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL Configuration (Let's Encrypt)
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/aqaarin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aqaarin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.aqaarin.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = aqaarin.com) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name aqaarin.com www.aqaarin.com _;
    return 404;
}
